# Punto unico de entrada del proyecto, tal como pide la Etapa 1: el usuario
# solo habla con este Nginx en el puerto 8080.
#
#   /        -> frontend (contenedor `frontend`, puerto 80)
#   /api/*   -> API       (contenedor `lomax-api`, puerto 3000)
#
# La barra final de proxy_pass es lo que descarta el prefijo /api, porque la
# API de la Etapa 4 no expone esa ruta. El proxy de Vite en desarrollo replica
# exactamente este comportamiento.

upstream lomax_frontend {
    server 127.0.0.1:8081;
}

# La API corre con network_mode: host porque necesita alcanzar el RDS de FLOCI
# en localhost:7001. El proxy usa la misma opcion, asi que ambos comparten la
# pila de red del host y se hablan por loopback: es la unica via que no pasa
# por las reglas de ufw, que bloquean el trafico de un bridge de Docker hacia
# el host. Ver la nota de desviacion en docs/ETAPA_5_FRONTEND.md.
upstream lomax_api {
    server 127.0.0.1:3000;
}

server {
    listen 8080;
    server_name _;

    # El enunciado limita la imagen a 5 MiB; se deja margen para que el
    # rechazo llegue como 413 de la API y no como un 413 de Nginx.
    client_max_body_size 8m;

    # El registro primero crea el producto y despues sube la imagen, que es la
    # peticion lenta: sin esto Nginx cortaria la carga con un 504.
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    location /api/ {
        proxy_pass http://lomax_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # La carga multipart pasa por aqui; Nginx no debe buffersizar el cuerpo
        # entero en disco, la API ya lo procesa en memoria.
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://lomax_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}