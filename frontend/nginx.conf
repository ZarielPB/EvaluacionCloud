# Nginx que sirve el bundle del frontend. NO es el punto de entrada: el proxy
# (proxy/nginx.conf) es quien recibe las peticiones del usuario en el 8080 y
# le reenvia aqui las de la ruta /.

server {
    # Puerto en loopback, no 80: el contenedor corre con network_mode: host
    # para poder ser alcanzable por el proxy sin que ufw filtre el trafico
    # entre contenedores y el host. El unico puerto publicado al exterior
    # sigue siendo el 8080 del proxy.
    # 127.0.0.1 y no 0.0.0.0: el frontend es interno y solo lo alcanza el proxy.
    listen 127.0.0.1:8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # El router usa BrowserRouter, asi que /catalogo o /productos/1 se piden
    # como archivos que no existen. Sin este fallback Nginx devolveria 404 en
    # vez de dejar que React Router resuelva la ruta en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan hash en el nombre, se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca se cachea: es el que apunta al bundle con hash nuevo.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}